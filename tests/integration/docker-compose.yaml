
services:
   db:
      image: jhnnsrs/daten:dev
      environment:
         POSTGRES_MULTIPLE_DATABASES: testdb
         POSTGRES_PASSWORD: test
         POSTGRES_USER: test
      labels:
         - fakts.service=live.arkitekt.postgres
      ports:
        - "${REKUEST_TEST_DB_PORT:-5555}:5432"
   redis:
      environment:
         REDIS_HOST: redis
         REDIS_PORT: 6379
      image: redis
      ports:
         - "${REKUEST_TEST_REDIS_PORT:-6666}:6379"

volumes:
   chroma_data:
